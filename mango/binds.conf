bind = SUPER, F5, reload_config

bind = SUPER, Q, killclient
bind = SUPER, RETURN, spawn, ghostty
bind = SUPER, E, spawn, ghostty -e spf
bind = SUPER, SPACE, spawn, vicinae toggle

bind = SUPER, V, togglefloating
bind = SUPER, M, togglemaximizescreen
bind = SUPER, F11, togglefullscreen
bind = SUPER + SHIFT, F11, togglefakefullscreen

bind = SUPER, TAB, focusstack, next
bind = SUPER + SHIFT, TAB, focusstack, prev

bind = SUPER, 8, setlayout, dwindle
bind = SUPER, 9, setlayout, monocle
bind = SUPER, 0, setlayout, scroller

# Change view
bind = SUPER, 1, view, 1
bind = SUPER, 2, view, 2
bind = SUPER, 3, view, 3
bind = SUPER, 4, view, 4
bind = SUPER, 5, view, 5
bind = SUPER, F, view, 6
bind = SUPER, P, view, 7

# Move window to tag
bind = SUPER + SHIFT, 1, tag, 1
bind = SUPER + SHIFT, 2, tag, 2
bind = SUPER + SHIFT, 3, tag, 3
bind = SUPER + SHIFT, 4, tag, 4
bind = SUPER + SHIFT, 5, tag, 5
bind = SUPER + SHIFT, F, tag, 6
bind = SUPER + SHIFT, P, tag, 7

# Toggle view of tag
bind = SUPER + CTRL, 1, toggleview, 1
bind = SUPER + CTRL, 2, toggleview, 2
bind = SUPER + CTRL, 3, toggleview, 3
bind = SUPER + CTRL, 4, toggleview, 4
bind = SUPER + CTRL, 5, toggleview, 5
bind = SUPER + CTRL, F, toggleview, 6
bind = SUPER + CTRL, P, toggleview, 7

# Toggle tag on windo
bind = SUPER + ALT, 1, toggletag, 1
bind = SUPER + ALT, 2, toggletag, 2
bind = SUPER + ALT, 3, toggletag, 3
bind = SUPER + ALT, 4, toggletag, 4
bind = SUPER + ALT, 5, toggletag, 5
bind = SUPER + ALT, F, toggletag, 6
bind = SUPER + ALT, P, toggletag, 7

bind = SUPER, W, focusdir, up
bind = SUPER, R, focusdir, down
bind = SUPER, A, focusdir, left
bind = SUPER, S, focusdir, right

bind = SUPER + SHIFT, W, move_client, up
bind = SUPER + SHIFT, R, move_client, down
bind = SUPER + SHIFT, A, move_client, left
bind = SUPER + SHIFT, S, move_client, right

bind = SUPER + CTRL, W, resizewin, 0, -50
bind = SUPER + CTRL, S, resizewin, 50, 0
bind = SUPER + CTRL, R, resizewin, 0, 50
bind = SUPER + CTRL, A, resizewin, -50, 0

bind = SUPER, Up, smartmovewin, up
bind = SUPER, Right, smartmovewin, right
bind = SUPER, Down, smartmovewin, down
bind = SUPER, Left, smartmovewin, left

bind = SUPER + CTRL, Up, smartresizewin, up
bind = SUPER + CTRL, Right, smartresizewin, right
bind = SUPER + CTRL, Down, smartresizewin, down
bind = SUPER + CTRL, Left, smartresizewin, left

bind = NONE, XF86AudioRaiseVolume, spawn, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 1%+
bind = NONE, XF86AudioLowerVolume, spawn, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 1%-
bind = NONE, XF86AudioMute, spawn, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = NONE, XF86AudioMicMute, spawn, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bind = NONE, XF86MonBrightnessUp, spawn, brightnessctl set 2%+
bind = NONE, XF86MonBrightnessDown, spawn, brightnessctl set 2%-

bind = NONE, XF86AudioPlay, spawn, playerctl play-pause
bind = NONE, XF86AudioNext, spawn, playerctl next
bind = NONE, XF86AudioPrev, spawn, playerctl previous
bind = NONE, XF86AudioStop, spawn, playerctl stop

mousebind = SUPER, btn_left, moveresize, curmove
mousebind = SUPER, btn_right, moveresize, curresize
